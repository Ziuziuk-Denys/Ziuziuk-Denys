name: Profile cards

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - assets/src/**

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 scripts/test_build.py

      - name: Build cards
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python3 scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh profile cards"
            git push
          fi
